          Object.defineProperty(window, 'fetch', {

          return str.indexOf('Cannot set property fetch') !== -1 ||

        window.onerror = function(msg, url, line, col, err) {
          if (isExtensionError(msg, url, err)) {

          }
        };

        window.addEventListener('error', function(event) {
          if (event && isExtensionError(event.message, event.filename, event.error)) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && isExtensionError('', '', event.reason)) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);

        var _origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return (a && a.stack) ? a.stack : String(a); }).join(' ');
          if (isExtensionError(joined, '', null)) {

          }
          return _origConsoleError.apply(console, args);
